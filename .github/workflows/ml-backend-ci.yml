name: ML Backend CI

on:
  push:
    paths:
      - 'ml_backend/**'
      - '.github/workflows/ml-backend-ci.yml'
  pull_request:
    paths:
      - 'ml_backend/**'
      - '.github/workflows/ml-backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml_backend/requirements.txt

      - name: Lint compile imports
        run: python -m compileall -q ml_backend

      - name: Run tests
        working-directory: ml_backend
        run: pytest -q
