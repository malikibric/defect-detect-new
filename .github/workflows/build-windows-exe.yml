name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh
        working-directory: python_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm --clean DefectDetect.spec

      - name: Package EXE
        run: |
          New-Item -ItemType Directory -Force -Path "dist-package" | Out-Null
          Copy-Item "dist/DefectDetect.exe" "dist-package/DefectDetect.exe"
          Compress-Archive -Path "dist-package/*" -DestinationPath "dist/DefectDetect-windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DefectDetect-windows
          path: python_app/dist/DefectDetect-windows.zip

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            python_app/dist/DefectDetect-windows.zip
          generate_release_notes: true
